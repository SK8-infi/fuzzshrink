name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core and test dependencies
        run: pip install "numpy>=1.24" "scipy>=1.10" "pandas>=2.0" "pytest>=7.4"
      - name: Run tests
        run: python -m pytest -q
