[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzshrink"
version = "0.1.0"
description = "Fuzzy-membership covariance shrinkage for portfolio risk"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
experiments = ["matplotlib>=3.7", "yfinance>=0.2.40", "lxml>=4.9", "requests>=2.31"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
